spring.application.name=MaraMate
server.port=8080

# MySQL 8 (SRS 2.1). Create the schema once:  CREATE DATABASE maramate;
# Override with environment variables instead of editing this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/maramate?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (FR-003). The secret must be 32+ characters. Use your own value outside development.
maramate.jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-0123}
maramate.jwt.expiry-hours=8

# React dev server (Vite)
maramate.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
